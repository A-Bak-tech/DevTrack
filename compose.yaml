
services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: devtrack_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack -d devtrack_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
